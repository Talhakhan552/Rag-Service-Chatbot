# Routes a single domain to both services:
#   /api/*  -> backend (FastAPI)
#   /docs   -> backend (Swagger UI)
#   /*      -> frontend (Next.js)
#
# Replace `your-domain.com` and the cert paths below. See
# DEPLOYMENT.md for how to obtain certificates (Let's Encrypt/certbot).

server {
    listen 80;
    server_name your-domain.com;

    # Redirect all plain HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Chat responses stream via Server-Sent Events -- proxy_buffering
    # off is required, or nginx will buffer the whole response before
    # forwarding it, defeating streaming entirely.
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://app:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}