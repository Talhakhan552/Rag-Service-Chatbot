# Production stack. Differences from docker-compose.yml (dev):
# - No source bind mounts -- the image is the deployed artifact, not
#   a live view of your working directory. Changes require a rebuild.
# - Adds the frontend as its own service.
# - restart: always everywhere, since there's no developer watching
#   the terminal to notice a crash and restart it manually.
# - App runs multiple uvicorn workers for real concurrency.
# - No Postgres container: the database is hosted (Supabase), set via
#   DATABASE_URL. Migrations run automatically before the app starts.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d

services:
  app:
    build: .
    container_name: rag_saas_app
    env_file: .env.production
    # --forwarded-allow-ips: trust nginx's X-Forwarded-For so rate limits see
    # real client IPs, not nginx's. Safe because the app port isn't published.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --forwarded-allow-ips '*'"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: rag_saas_frontend
    depends_on:
      app:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rag_saas_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Terminates TLS and routes both services under one domain --
  # app.example.com/ -> frontend, app.example.com/api/ -> backend.
  # See DEPLOYMENT.md for the matching nginx config and TLS setup.
  nginx:
    image: nginx:alpine
    container_name: rag_saas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
    restart: always

volumes:
  uploads_data: